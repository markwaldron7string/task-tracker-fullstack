<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#DD0031" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Task Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <script>
      const t = localStorage.getItem('theme');
      if (t === 'custom') {
        try {
          const c = JSON.parse(localStorage.getItem('theme-custom') || 'null');
          if (c && c.base) document.documentElement.setAttribute('data-theme', c.base + '-custom');
        } catch (e) {}
      } else if (t) {
        document.documentElement.setAttribute('data-theme', t);
      }
    </script>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
