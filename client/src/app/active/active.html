<div class="card">
  <h2>Active Tasks</h2>
  <div class="task-list" role="list">
    @for (task of store.activeEnrichedTasks(); track task.id) {
      <app-task-item
        role="listitem"
        [task]="task"
        (toggle)="store.toggleTask($event)"
        (remove)="store.removeTask($event)"
        (edit)="store.editTask($event.id, $event.title)"
        (update)="store.updateTask($event.id, $event)"
      />
    } @empty {
      <div class="empty-state">All caught up — nothing active!</div>
    }
  </div>
</div>
