@if (onboarding.active() && step(); as current) {
  <div
    class="tour-root"
    [class.tour-root--keyboard-open]="keyboardOpen()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="current.title"
  >
    @if (spotlight(); as box) {
      <div
        class="tour-spotlight tour-spotlight--pulse"
        [style.top.px]="box.top"
        [style.left.px]="box.left"
        [style.width.px]="box.width"
        [style.height.px]="box.height"
        [style.border-radius]="box.radius"
      ></div>
    } @else if (showFullScrim()) {
      <div class="tour-scrim tour-scrim--full"></div>
    }

    @if (pointer(); as arrow) {
      <div
        class="tour-pointer"
        [class.tour-pointer--upward]="arrow.rotation === 0"
        [class.tour-pointer--rightward]="arrow.rotation === 90"
        aria-hidden="true"
        [style.left.px]="arrow.x"
        [style.top.px]="arrow.y"
        [style.--pointer-rotate.deg]="arrow.rotation"
      ></div>
    }

    <article
      class="tour-flag"
      [class.tour-flag--center]="flagPlacement() === 'center'"
      [class.tour-flag--anchored]="flagPos() !== null"
      [class.tour-flag--theme-step]="current.id === 'theme'"
      [style.--flag-top.px]="flagPos()?.top"
      [style.--flag-left.px]="flagPos()?.left"
      [style.--flag-arrow-x.px]="flagPos()?.arrowX"
      [attr.data-placement]="flagPlacement()"
    >
      <p class="tour-progress">{{ onboarding.progressLabel() }}</p>
      <h2 class="tour-title">{{ stepTitle(current) }}</h2>
      <p class="tour-body">{{ stepBody(current) }}</p>
      <div class="tour-actions">
        <div class="tour-actions-left">
          <button type="button" class="tour-skip" (click)="onboarding.skip()">{{ skipLabel() }}</button>
          @if (showThemeSkip()) {
            <button type="button" class="tour-step-skip" (click)="onboarding.skipThemeStep()">Skip color selection</button>
          }
          @if (showAddTaskSkip()) {
            <button type="button" class="tour-step-skip" (click)="onboarding.skipAddTaskStep()">Skip adding a task</button>
          }
        </div>
        <button type="button" class="tour-next" [disabled]="!canAdvance()" (click)="onNext()">
          {{ nextLabel() }}
        </button>
      </div>
    </article>
  </div>
}
